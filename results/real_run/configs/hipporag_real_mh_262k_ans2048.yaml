# RE-ANSWER (paid, answers only): HippoRAG 2 with up to 2,048 answer tokens, HippoRAG's own default
# and what the paper used (it never capped HippoRAG). Reuses the saved index.
run_name: exp_hipporag_real_mh_262k_ans2048
method: hipporag_bundled
method_config:
  cap_answer: true
  json_openie: schema
  shared_index: results/checkpoints/shared_graphs/hipporag_real_mh_262k_schema
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 2048
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
