# REAL RUN (paid). Baseline: HippoRAG 2 (the benchmark's bundled copy), under the same conditions
# as the A-D / BM25 real run: FC-MH 262K, 100 questions, Claude Haiku 5.5 for every LLM call,
# BAAI/bge-small-en-v1.5 embeddings, the benchmark's rag_agent prompt, top 10 passages, answer
# capped at 16 tokens like every other method (cap_answer). Builds the HippoRAG index once in
# shared_index; the 256-token run reuses it.
run_name: exp_hipporag_real_mh_262k
method: hipporag_bundled
method_config:
  cap_answer: true
  json_openie: schema
  shared_index: results/checkpoints/shared_graphs/hipporag_real_mh_262k_schema
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 16
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
