# REAL RUN (paid). Experiment A: PPR picks 400 nodes, then GNN + GOAt (the current method).
# FC-MH 262K, 100 questions, 50-fact budget, Claude Haiku 5.5 writes the graph and answers.
# A, B and C share one graph: the first run builds it (and pays for it), the others load it.
run_name: exp_a_real_mh_262k
method: sgar
method_config:
  retrieval: gnn_goat
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 16
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
