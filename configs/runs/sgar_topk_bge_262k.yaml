# One check of the bge-small GNN at 262K: all questions, fake LLM (no API calls).
run_name: sgar_topk_bge_262k
method: sgar
method_config:
  retrieval: gnn_topk
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
data:
  length: 262k
  splits: [sh, mh]
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 16
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
