# Offline pipeline test: no API calls (llm.mode: fake), first 3 questions of each split at 6K.
run_name: total_agent_memory_fake_6k
method: total_agent_memory
data:
  length: 6k
  splits: [sh, mh]
  max_questions: 3
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 16
embedding_model: "hash:384"
repeats: 1
