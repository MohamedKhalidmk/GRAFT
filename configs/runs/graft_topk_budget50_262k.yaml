# Does the GNN's choice matter? 50-fact limit, so ranking decides what reaches the model. Fake LLM.
run_name: graft_topk_budget50_262k
method: graft
method_config:
  retrieval: gnn_topk
  max_facts: 50
  retrieval_workers: 32
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
data:
  length: 262k
  splits: [sh, mh]
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 16
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
