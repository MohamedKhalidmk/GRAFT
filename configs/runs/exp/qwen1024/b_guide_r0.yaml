# FREE (Qwen, test 08 run-02, user 2026-11-21): b_guide at a 1,024-token answer cap, repeat 0 as its own job
# (vLLM seed 20261119+0, VLLM_SEED). Same graph, prompts and settings as configs/runs/exp/qwen/b_guide_empty.yaml otherwise:
# at 256 tokens 26-35% of Qwen's one-call answers were cut before a final answer.
run_name: exp_qwen1024_b_guide_r0
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits:
  - mh
llm:
  model: qwen
  mode: local
  answer_max_tokens: 1024
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
