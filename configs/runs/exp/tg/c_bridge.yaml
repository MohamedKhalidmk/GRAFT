# PAID (test 06 arm C, T-REx as a bridge only): the test 04 full T-REx graph (original, uncleaned), mode C with GOAt. Edges
# touching a T-REx fact walk at weight 0.2 (document edges 1.0), and only document facts are returned to Haiku.
run_name: exp_real_tg_c_bridge
method: graft
method_config:
  retrieval: ppr_goat_ppr
  explainer: goat
  start_graph: outside
  start_graph_path: results/checkpoints/base_graphs/trex_full_base.json
  writer_linking: llm
  linking_candidates: 10
  max_facts: 50
  bridge_weight: 0.2
  document_facts_only: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_trexfull_link_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
