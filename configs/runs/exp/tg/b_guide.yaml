# PAID (test 06 arm B, T-REx as a structure guide; design docs/design/graft_trex_structure_guide_design.md): arm A's
# empty-start document graph and mode C, plus the guide's linking pass and chain planning. No T-REx fact reaches Haiku.
run_name: exp_real_tg_b_guide
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
