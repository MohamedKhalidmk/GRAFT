# Experiment C: PPR cuts to 400, GNN + GOAt, then a short second PPR from the picks. Fake LLM: measures whether the answer reached the model.
# Same split, budget and checkpoint for A, B, C: 262K, SH + MH (100 each), 50 facts, gnn_bge_400w.
run_name: exp_c_fake_262k
method: sgar
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
data:
  length: 262k
  splits: [sh, mh]
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 16
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
