# FREE (GRAFT test 09, docs/design/graft_adaptive_retrieval_design.md): fake answers, real retrieval; gold-in-facts only.
# G35 as it runs: 50 facts.
run_name: exp_fake_ad_g35_50
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
  max_tokens: 40000
data:
  length: 262k
  splits:
  - mh
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
