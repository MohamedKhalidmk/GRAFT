# PAID: question graph (Haiku parses each question into schema edges with ?placeholders, attached for that question only): mode C, EiG, 400 nodes.
run_name: exp_c_real_mh_262k_ans256_qgraph_eig
method: graft
method_config:
  retrieval: ppr_goat_ppr
  explainer: eig
  query_graph: true
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
