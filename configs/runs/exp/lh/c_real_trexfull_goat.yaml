# PAID: GOAt instead of EiG on the full T-REx base + documents (graph built by c_real_trexfull_link_build_eig.yaml, reused). Mode C, 3 repeats.
# graph (my_method/base_graph.py: 20,000 Freebase facts, 751 relations, leakage-checked), as experiment D did with its
# 150-entity synthetic world. Saved as a new shared graph for every later read variant. Mode C, EiG, 400 nodes; one
# real answer pass on layers 1+2 (the question layer is tested afterwards).
run_name: exp_c_real_mh_262k_ans256_trexfull_goat
method: graft
method_config:
  retrieval: ppr_goat_ppr
  explainer: goat
  start_graph: outside
  start_graph_path: results/checkpoints/base_graphs/trex_full_base.json
  writer_linking: llm
  linking_candidates: 10
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_trexfull_link_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
