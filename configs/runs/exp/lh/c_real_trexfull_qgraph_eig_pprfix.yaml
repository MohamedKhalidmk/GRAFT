# PAID: answer passes only, after the PageRank stop-rule fix (my_method/gnn/features.py pagerank): reuses the full T-REx
# graph built by c_real_trexfull_link_build_eig.yaml, uncleaned (user: the dropped items are mostly real facts),
# with the single-stopword linking rule. The first runs under the old run_name scored 0.0 (empty retrieval).
run_name: exp_c_real_mh_262k_ans256_trexfull_qgraph_eig_pprfix
method: graft
method_config:
  retrieval: ppr_goat_ppr
  explainer: eig
  start_graph: outside
  start_graph_path: results/checkpoints/base_graphs/trex_full_base.json
  writer_linking: llm
  query_graph: true
  query_linking: llm
  linking_candidates: 10
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_trexfull_link_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
