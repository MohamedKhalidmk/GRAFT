# FREE CHECK (fake LLM): mode C, EiG, 400 nodes on the grafted graph (base + documents, Haiku entity linking). Compare with mode C (51%) and experiment D (44%).
run_name: exp_c_fake_mh_262k_rog_link_eig
method: graft
method_config:
  retrieval: ppr_goat_ppr
  explainer: eig
  start_graph: outside
  start_graph_path: results/checkpoints/base_graphs/rog_base.json
  writer_linking: llm
  linking_candidates: 10
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_rog_link_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
