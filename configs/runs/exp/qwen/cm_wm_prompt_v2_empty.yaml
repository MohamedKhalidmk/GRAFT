# FREE (Qwen, test 05 arm C-, step prompt v2): the same steps, chain in the prompt only.
# Empty-start document graph, mode C with GOAt, 256-token answers, 3 repeats; same prompts and graph as the Haiku arm.
run_name: exp_qwen_empty_cm_wm_prompt_v2
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  retrieval_workers: 8
  working_memory: prompt_only
  wm_step_prompt: v2
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: qwen
  mode: local
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
