# FREE (Qwen, test 06 arm B on Qwen): the T-REx structure guide (linking + planning) on the empty-start graph; same prompts.
run_name: exp_qwen_empty_b_guide
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: qwen
  mode: local
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
