# FREE (Qwen, test 08 run-02, user 2026-11-21): test 06 arm E on Qwen, the T-REx guide (linking + planning) plus working
# memory written into the graph with the newer-fact step prompt (C v2); the guide's planned chain is cited from the
# first step. Same job and day as b_guide_sameday_empty.yaml. Same prompts, graph and 256-token answers as run-01.
run_name: exp_qwen_empty_e_guide_wm_v2
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  working_memory: graph
  wm_step_prompt: v2
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: qwen
  mode: local
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
