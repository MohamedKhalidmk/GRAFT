# PAID (test 05, working memory; design docs/design/graft_working_memory_design.md). A: mode C, one answer call (baseline).
# Empty-start document graph, mode C with GOAt, Haiku, 256-token answers, 3 repeats.
run_name: exp_wm_empty_a_modec
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
