# PAID (test 05 run-02, step prompt v2: newer fact wins, working memory; design docs/design/graft_working_memory_design.md). C: working memory written into the graph.
# Empty-start document graph, mode C with GOAt, Haiku, 256-token answers, 3 repeats.
run_name: exp_wm_empty_c_wm_graph_v2
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  retrieval_workers: 8
  working_memory: graph
  wm_step_prompt: v2
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits: [mh]
llm:
  model: claude-haiku-5-5
  mode: real
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 3
