# FREE (GRAFT test 10 toy check, user 2026-11-22): G53 on the first 10 questions with real Qwen, before any run: do the
# OPEN lines parse, does the loop stop, are answers non-empty. Not a result.
run_name: exp_toy_passages_g53
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 400
  max_tokens: 40000
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
  passages:
    arm: guided
    budget_tokens: 4096
    passage_tokens: 256
    summary_facts: 30
    reading: true
    max_asks: 3
    open_tokens: 1024
    header: "PASSAGES (source text of the knowledge pool, most relevant first):"
data:
  length: 262k
  splits:
  - mh
  max_questions: 10
llm:
  model: qwen
  mode: local
  answer_max_tokens: 1024
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
