# FREE (GRAFT test 10, user 2026-11-22): G49, the index: the guided ranking (up to 400 facts) brings each fact's source passage, cut at 4,096 tokens, then a 30-fact summary. FactConsolidation mh 262k, Haiku-built graph, Qwen at a
# 1,024-token answer cap, repeat 2 as its own job (vLLM seed 20261119+2, VLLM_SEED); all 12 jobs the same day.
run_name: exp_passages_g49_r2
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 400
  max_tokens: 40000
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
  passages:
    arm: guided
    budget_tokens: 4096
    passage_tokens: 256
    summary_facts: 30
    header: "PASSAGES (source text of the knowledge pool, most relevant first):"
data:
  length: 262k
  splits:
  - mh
llm:
  model: qwen
  mode: local
  answer_max_tokens: 1024
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
