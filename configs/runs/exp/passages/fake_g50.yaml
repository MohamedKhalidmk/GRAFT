# FREE (GRAFT test 10 smoke): fake answers, real retrieval on the real graph; checks the arm end to end and gives gold in context and tokens shown.
run_name: exp_fake_passages_g50
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
  passages:
    arm: hipporag
    budget_tokens: 4096
    passage_tokens: 256
    summary_facts: 30
    header: "PASSAGES (source text of the knowledge pool, most relevant first):"
data:
  length: 262k
  splits:
  - mh
llm:
  model: claude-haiku-5-5
  mode: fake
  answer_max_tokens: 256
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
