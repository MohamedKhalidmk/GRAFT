# FREE (GRAFT test 10, user 2026-11-22): G35, the guided facts (50 fact lines), as test 09. FactConsolidation mh 262k, Haiku-built graph, Qwen at a
# 1,024-token answer cap, repeat 1 as its own job (vLLM seed 20261119+1, VLLM_SEED); all 12 jobs the same day.
run_name: exp_passages_g35_r1
method: graft
method_config:
  retrieval: ppr_goat_ppr
  max_facts: 50
  trex_guide: results/checkpoints/trex_guide.json
  guide_linking: true
  guide_planning: true
  retrieval_workers: 8
  gnn_checkpoint: results/checkpoints/gnn_bge_400w
  shared_graph: results/checkpoints/shared_graphs/real_mh_262k_empty_start.json
data:
  length: 262k
  splits:
  - mh
llm:
  model: qwen
  mode: local
  answer_max_tokens: 1024
embedding_model: BAAI/bge-small-en-v1.5
repeats: 1
