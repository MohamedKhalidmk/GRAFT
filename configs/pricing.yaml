# USD per million tokens. Source: Anthropic model docs, cached 2026-10-06.
# Claude Haiku 5.5 bills a request on the long rate card when its prompt exceeds 100K tokens.
claude-haiku-5-5:
  long_prompt_threshold: 100000
  short: {input: 0.10, output: 0.50}
  long: {input: 0.50, output: 2.50}
  cache_read_multiplier: 0.1
  cache_write_multiplier: 1.25
